services:
  traefik:
    container_name: saddle-traefik
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=saddle-network"
      - "--entrypoints.web.address=:80"
      # TLS. The admin login posts the password as JSON, so an http-only origin
      # puts it on the wire in clear text.
      - "--entrypoints.websecure.address=:443"
      # Let's Encrypt over the HTTP-01 challenge, which rides the web entrypoint:
      # :80 must stay published for issuance and renewal. sslip.io resolves the
      # public hosts this deployment serves, so no DNS work is needed.
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.le.acme.storage=/acme/acme.json"
      # Uncomment to receive expiry notices from Let's Encrypt.
      # - "--certificatesresolvers.le.acme.email=you@example.com"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      - DOCKER_API_VERSION=1.45
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-acme:/acme"
    networks:
      - saddle-network
    restart: unless-stopped

  saddle-app:
    container_name: saddle-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3080:3080"
    environment:
      - NODE_ENV=production
      - SADDLE_ADMIN_PASSWORD=${SADDLE_ADMIN_PASSWORD:-}
      - POSTGRES_URL=postgresql://saddle:fuckyoumoney@postgres:5432/saddle
      - REDIS_URL=redis://redis:6379
      - SADDLE_SERVER_IP=${SADDLE_SERVER_IP:-auto}
      - HOST_PUBLIC_IP=${HOST_PUBLIC_IP:-auto}
      # Authorities the /api trust fence accepts beyond loopback. The domain must
      # be listed: the fence refuses any other Host, so a missing entry 403s
      # every API call over it while static assets keep loading.
      - SADDLE_TRUSTED_HOSTS=${SADDLE_TRUSTED_HOSTS:-91.99.165.95 91.99.165.95.sslip.io}
      - STEEL_BROWSER_URL=${STEEL_BROWSER_URL:-http://saddle-steel:3000}
      # BYOK and billing protection flags
      - ENFORCE_BILLING_GATE=true
      - MAX_CONCURRENT_JOBS_BYOK=2
      - STORAGE_QUOTA_MB_BYOK=1024
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - saddle-data:/app/data
      - saddle-root:/root
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:rw
    networks:
      - saddle-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.saddle.rule=PathPrefix(`/`)"
      - "traefik.http.routers.saddle.priority=1"
      - "traefik.http.routers.saddle.entrypoints=web"
      # Two routers over one service: plain http keeps working exactly as before
      # (embedded http app panes would otherwise be blocked as mixed content) and
      # https is added beside it, where the admin password belongs. Separate
      # routers rather than one router on both entrypoints, because TLS options
      # belong to the TLS entrypoint only.
      #
      # The https rule names the admin host explicitly: a certificate request
      # needs a domain, and a PathPrefix-only rule gives the resolver none, which
      # is why the first attempt served Traefik's default self-signed cert. Other
      # hosts reach their own routers over http as they do today; giving a
      # deployed app https means adding `tls.certresolver=le` and a Host rule to
      # ITS router, which issues a certificate for that name.
      - "traefik.http.routers.saddle-https.rule=Host(`91.99.165.95.sslip.io`)"
      - "traefik.http.routers.saddle-https.priority=1"
      - "traefik.http.routers.saddle-https.entrypoints=websecure"
      - "traefik.http.routers.saddle-https.tls.certresolver=le"
      - "traefik.http.services.saddle.loadbalancer.server.port=3080"

  postgres:
    container_name: saddle-postgres
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=saddle
      - POSTGRES_PASSWORD=fuckyoumoney
      - POSTGRES_DB=saddle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - saddle-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saddle -d saddle"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: saddle-redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - saddle-network
    command: redis-server --appendonly yes
    restart: unless-stopped

  steel:
    container_name: saddle-steel
    image: ghcr.io/steel-dev/steel-browser-api:latest
    environment:
      - STEEL_API_KEY=${STEEL_API_KEY:-}
      - TWO_CAPTCHA_API_KEY=${TWO_CAPTCHA_API_KEY:-}
      - DOMAIN=steel.${HOST_PUBLIC_IP:-91.99.165.95}.sslip.io
    networks:
      - saddle-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.steel.rule=Host(`steel.${HOST_PUBLIC_IP:-91.99.165.95}.sslip.io`) || Host(`steel.91.99.165.95.sslip.io`)"
      - "traefik.http.routers.steel.entrypoints=web"
      - "traefik.http.services.steel.loadbalancer.server.port=3000"

networks:
  saddle-network:
    name: saddle-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  saddle-data:
  saddle-root:
  # ACME account key + issued certificates, so renewals survive recreates.
  traefik-acme:
