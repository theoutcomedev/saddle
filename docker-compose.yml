version: '3.8'

services:
  saddle-app:
    container_name: saddle-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3080:3080"
    environment:
      - NODE_ENV=production
      - POSTGRES_URL=postgresql://saddle:fuckyoumoney@postgres:5432/saddle
      - REDIS_URL=redis://redis:6379
      # BYOK and billing protection flags
      - ENFORCE_BILLING_GATE=true
      - MAX_CONCURRENT_JOBS_BYOK=2
      - STORAGE_QUOTA_MB_BYOK=1024
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - saddle-data:/app/data

  postgres:
    container_name: saddle-postgres
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=saddle
      - POSTGRES_PASSWORD=fuckyoumoney
      - POSTGRES_DB=saddle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saddle -d saddle"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    container_name: saddle-redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  saddle-data:
